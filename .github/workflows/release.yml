on:
  push:
    branches:
      - main
    paths:
      - jev_operator_search/blender_manifest.toml

name: Release

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' jev_operator_search/blender_manifest.toml)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is already released, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy LICENSE into extension folder
        if: steps.version.outputs.changed == 'true'
        run: cp -p LICENSE jev_operator_search/

      - name: Create zip
        if: steps.version.outputs.changed == 'true'
        run: zip -r -9 jev-operator-search-v${{ steps.version.outputs.version }}.zip jev_operator_search/ -x "*/__pycache__/*" "*.pyc"

      - name: Create a Release
        if: steps.version.outputs.changed == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: jev-operator-search v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            jev-operator-search-v${{ steps.version.outputs.version }}.zip
          draft: false
          generate_release_notes: true
          prerelease: false
